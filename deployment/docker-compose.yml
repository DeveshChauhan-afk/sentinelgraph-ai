version: '3.8'

services:
  # FastAPI Application Backend
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sentinelgraph_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: sentinelgraph_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-sentinelgraph}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-0000}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-sentinelgraph}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Persistent Storage Volumes
volumes:
  postgres_data:
