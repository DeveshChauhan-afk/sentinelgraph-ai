# ==============================================================================
# Prometheus Configuration for SentinelGraph AI
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  # 1. SentinelGraph AI FastAPI Backend Metrics
  - job_name: "sentinelgraph-backend"
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "api:8000"
        labels:
          service: "sentinelgraph-backend"
          environment: "production"

  # 2. Prometheus Self-Monitoring
  - job_name: "prometheus"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          service: "prometheus"
