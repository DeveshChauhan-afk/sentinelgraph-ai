apiVersion: 1

providers:
  - name: SentinelGraph AI Dashboards
    orgId: 1
    folder: SentinelGraph
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
